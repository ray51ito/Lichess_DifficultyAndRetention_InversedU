[project]
name = "lichess-d1"
version = "1.0.0"
description = "Reproduces the paper on AI opponent difficulty and players' return to bots on Lichess"
readme = "README.md"
license = "MIT"
authors = [
    { name = "konbraphat", email = "konbraphat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "matplotlib==3.11.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "patsy==1.0.3",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "pyyaml>=6.0",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20261103",
]

[project.scripts]
d1 = "lichess_d1.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "D"]
ignore = ["PLR0913", "PLR2004", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
"scripts/**" = ["E501", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
mypy_path = "src,scripts"

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "matplotlib.*", "pyarrow.*", "patsy.*", "nbformat.*", "nbclient.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-p no:faulthandler"
